---
name: CI
on:
  pull_request:
  push:
    branches: [main, master, 'release-*']
    tags: ['v*']

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.x
          cache: true
      - name: Run tests
        run: make test

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.x
          cache: true
      - name: Build
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: "~> v2"
          args: build --snapshot
      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.6.2
        with:
          name: promql-langserver
          path: |
            dist/*.json
            dist/promql-langserver*
          if-no-files-found: error

  check_repo_consistency:
    name: Check repository consistency
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.x
          cache: true
      - name: Check formatting
        run: |
          make fmt
          git diff --exit-code
      - name: Check internal packages
        run: |
          make update_internal_packages
          git diff --exit-code
      - name: Check go.mod and go.sum
        run: |
          go mod tidy
          git diff --exit-code

  publish_release:
    name: Publish release
    runs-on: ubuntu-latest
    needs: [test, build, check_repo_consistency]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    environment: release
    env:
      DOCKER_LOGIN: ${{ secrets.DOCKER_HUB_LOGIN }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_HUB_PASSWORD }}
      QUAY_LOGIN: ${{ secrets.QUAY_IO_LOGIN }}
      QUAY_PASSWORD: ${{ secrets.QUAY_IO_PASSWORD }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.x
          cache: true
      - name: Login to Docker Hub
        run: echo "${DOCKER_PASSWORD}" | docker login docker.io -u "${DOCKER_LOGIN}" --password-stdin
      - name: Login to quay.io
        run: echo "${QUAY_PASSWORD}" | docker login quay.io -u "${QUAY_LOGIN}" --password-stdin
      - name: Reset repository
        run: git reset --hard
      - name: Release
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: "~> v2"
          args: release
        env:
          GITHUB_TOKEN: ${{ github.token }}
